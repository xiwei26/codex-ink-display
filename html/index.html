<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex 墨水屏用量看板</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">NRF52811 · 4.2 INCH E-PAPER</p>
      <h1>Codex 用量看板</h1>
      <p>通过蓝牙把你的 Codex 用量显示到墨水屏。</p>
    </header>

    <section class="card connection-card">
      <div>
        <h2>设备连接</h2>
        <p id="connectionStatus" class="status">未连接</p>
      </div>
      <button id="connectButton" type="button">连接 NRF_EPD</button>
    </section>

    <section class="card">
      <div class="section-heading">
        <div>
          <h2>用量数据</h2>
          <p>Token 单位为 M；费用单位为 USD。发送时会同步屏幕时间。</p>
        </div>
        <button id="sendButton" type="button" disabled>发送到墨水屏</button>
      </div>

      <form id="dashboardForm">
        <div class="grid">
          <label>今日 Token (M)<input id="todayTokens" type="number" min="0" max="6553.5" step="0.1" value="133.9" required></label>
          <label>本月 Token (M)<input id="monthTokens" type="number" min="0" max="6553.5" step="0.1" value="460.4" required></label>
          <label>今日请求数<input id="todayRequests" type="number" min="0" max="65535" step="1" value="1053" required></label>
          <label>本月请求数<input id="monthRequests" type="number" min="0" max="65535" step="1" value="4306" required></label>
          <label>今日费用 (USD)<input id="todayCost" type="number" min="0" max="655.35" step="0.01" value="86.75" required></label>
          <label>本月费用 (USD)<input id="monthCost" type="number" min="0" max="655.35" step="0.01" value="339.66" required></label>
          <label>Claude Token (M)<input id="claudeTokens" type="number" min="0" max="6553.5" step="0.1" value="0" required></label>
          <label>Codex Token (M)<input id="codexTokens" type="number" min="0" max="6553.5" step="0.1" value="133.9" required></label>
        </div>
        <label class="trend">近 7 日 Token (M，以逗号分隔)<input id="trend" type="text" value="7.6, 9.3, 5.8, 5.2, 6.8, 6.1, 8.8" required></label>
      </form>
    </section>

    <section class="note">
      <strong>提示：</strong> 请使用 Chrome 或 Edge，通过 <code>http://localhost</code> 或 HTTPS 打开本页；浏览器蓝牙不支持直接打开本地文件。
    </section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
